<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: green;
            padding: 20px;
            border: none;
        }
    </style>
</head>
<body>
    <button id="btn">😍</button>

    <script>
        let btnEvent = document.getElementById("btn")

        btnEvent.addEventListener("click", ()=>{
            btnEvent.style.backgroundColor = "red"
        })

        btnEvent.addEventListener("mouseenter", ()=>{
            btnEvent.innerText = "😁"
        })

        btnEvent.addEventListener("mouseleave", ()=>{
            btnEvent.innerText = "💋"
        })
    </script>
</body>
</html>
